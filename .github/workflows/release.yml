# Creates a GitHub release whenever the "version" in module.json changes on main
# (or when started manually). The release gets the tag v<version> and the
# assets module.json + module.zip that Foundry installs from.
name: Release

on:
  push:
    branches: [main]
    paths: [module.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(jq -r .version module.json)"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION gibt es schon – nichts zu tun."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check script version stamps
        if: steps.version.outputs.exists == 'false'
        run: |
          V="$(jq -r .version module.json)"
          if grep -rEn 'from "\.{1,2}/[^"]+\.js(\?v=[^"]*)?"' scripts | grep -v "?v=$V\""; then
            echo "Imports nicht auf Version $V – bitte 'node tools/set-version.mjs $V' ausführen."
            exit 1
          fi

      - name: Test
        if: steps.version.outputs.exists == 'false'
        run: node test/run.mjs

      - name: Build zip
        if: steps.version.outputs.exists == 'false'
        run: zip -r module.zip module.json scripts styles LICENSE README.md

      - name: Create release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          NOTES="$(awk -v v="## ${TAG#v}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md)"
          [ -z "$NOTES" ] && NOTES="Version ${TAG#v}"
          gh release create "$TAG" module.json module.zip \
            --target "$GITHUB_SHA" --title "$TAG" --notes "$NOTES" --latest
