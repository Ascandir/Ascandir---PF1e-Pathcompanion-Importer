# Builds module.zip + module.json and attaches them to a published GitHub release.
# Create a release with a tag like "v1.0.1" – the version in module.json is set from the tag.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' module.json > module.tmp && mv module.tmp module.json

      - name: Test
        run: node test/run.mjs

      - name: Build zip
        run: zip -r module.zip module.json scripts styles LICENSE README.md

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" module.json module.zip --clobber
