# Pushing a tag like "v1.0.1" creates the GitHub release automatically,
# sets the version in module.json from the tag and attaches module.json + module.zip.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' module.json > module.tmp && mv module.tmp module.json

      - name: Test
        run: node test/run.mjs

      - name: Build zip
        run: zip -r module.zip module.json scripts styles LICENSE README.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          [ -z "$NOTES" ] && NOTES="Version ${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" module.json module.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" module.json module.zip --title "$GITHUB_REF_NAME" --notes "$NOTES" --latest
          fi
