# Manually remove a release and its tag (e.g. after a version renumbering).
name: Delete release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag des Releases, das gelöscht werden soll (z. B. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
